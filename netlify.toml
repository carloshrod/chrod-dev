[[redirects]]
  from = "https://chrod.netlify.app/*"
  to = "https://chrod.dev/:splat"
  status = 301
  force = true

# Old un-prefixed EN routes now live under /en
[[redirects]]
  from = "/privacy-policy"
  to = "/en/privacy-policy"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/en/terms"
  status = 301

[[redirects]]
  from = "/review"
  to = "/en/review"
  status = 301

# Spanish routes are now translated (see src/i18n/routes.ts).
# Detail pages come first: splat rules would otherwise swallow them.
[[redirects]]
  from = "/es/services/business-websites"
  to = "/es/servicios/sitios-web-profesionales"
  status = 301

[[redirects]]
  from = "/es/services/ecommerce-development"
  to = "/es/servicios/desarrollo-ecommerce"
  status = 301

[[redirects]]
  from = "/es/services/web-applications"
  to = "/es/servicios/aplicaciones-web"
  status = 301

[[redirects]]
  from = "/es/services/workflow-automation"
  to = "/es/servicios/automatizacion-de-procesos"
  status = 301

[[redirects]]
  from = "/es/services/api-backend-development"
  to = "/es/servicios/desarrollo-api-backend"
  status = 301

# landing-pages keeps its slug in both languages
[[redirects]]
  from = "/es/services/*"
  to = "/es/servicios/:splat"
  status = 301

[[redirects]]
  from = "/es/services"
  to = "/es/servicios"
  status = 301

# Project slugs were renamed in Sanity, in both languages, and the
# `/es/projects/*` splat that used to sit below preserved the slug while
# translating only the segment. So it answered every old Spanish URL with a
# permanent redirect to a page that does not exist, and Google followed those
# redirects and recorded the dead targets too. That leaves four shapes of dead
# URL per project, all confirmed 404 against production, all listed here.
#
# The splat is gone on purpose: an unknown old slug now gets a clean 404
# instead of a 301 into one. `assertProjectRedirects` in src/lib/redirects.ts
# keeps this list in step with Sanity, because the comment that used to stand
# here was correct when written and then rotted in silence.

